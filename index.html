<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game-Idea & Mechanic Generator</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components/chip.css">
  <link rel="stylesheet" href="styles/components/tooltip.css">
  <link rel="stylesheet" href="styles/components/modal.css">
  <link rel="stylesheet" href="styles/components/tagTree.css">
  <link rel="stylesheet" href="styles/components/panel.css">
  <link rel="stylesheet" href="styles/components/tabs.css">
  <script type="importmap">
    {
      "imports": {
        "lit-html": "https://cdn.jsdelivr.net/npm/lit-html@2.7.4/lit-html.min.js"
      }
    }
  </script>
  <script type="module" src="scripts/main.js"></script>
</head>
<body>
  <header>
    <h1>Game-Idea & Mechanic Generator</h1>
  </header>

  <main class="app-container">
    <section id="generator-panel" class="panel">
      <h2>Generator Options</h2>
      <div id="taxonomy-tabs-container">
        <div id="taxonomy-tab-buttons"></div>
        <div id="taxonomy-tab-content"></div>
      </div>
      <div class="source-controls">
        <div class="control-group">
          <label for="term-quantity">Terms:</label>
          <input type="range" id="term-quantity" min="1" max="10" value="3">
          <span id="term-quantity-display">3</span>
        </div>

        <div class="control-group">
          <label for="custom-text">Custom Text:</label>
          <textarea id="custom-text" placeholder="Enter your own terms or ideas here..."></textarea>
        </div>

        <div class="control-group">
          <label for="use-draft-context" id="use-draft-context-label">
            <input type="checkbox" id="use-draft-context" checked>
            Use Draft Context for LLM/Hybrid
          </label>
        </div>

        <div class="section-toggles">
          <h3>Include Sections:</h3>
          <div id="section-toggle-container"></div>
        </div>

        <div id="selected-tags-section">
          <h4>Selected Tags:</h4>
          <div id="selected-tags-list-container">
            <ul id="selected-tags-list">
              <!-- Selected tags will be listed here -->
            </ul>
          </div>
        </div>

        <button id="generate-ideas-btn" class="primary-btn">Generate Ideas</button>
      </div>
    </section>

    <section id="generated-ideas-panel" class="panel">
      <h2>Generated Ideas</h2>
      <div id="generated-ideas-container" class="results-container"></div>
    </section>

    <section id="draft-panel" class="panel">
      <h2>Design Draft</h2>
      <div id="draft-container" class="editable-container"></div>
      <div class="draft-controls">
        <button id="cohere-draft-btn" class="primary-btn">Cohere Draft</button>
        <button id="clear-draft-btn" class="danger-btn">Clear Draft</button>
      </div>
    </section>

    <section id="brief-panel" class="panel">
      <h2>Design Brief</h2>
      <div class="brief-generation-options">
        <h4>Brief Options:</h4>
        <div class="control-group brief-type-group">
          <label>Brief Focus:</label>
          <select id="brief-type-select">
            <option value="full" selected>Full Game Design</option>
            <option value="loop">Core Gameplay Loop</option>
            <option value="mechanics">Mechanics Focus</option>
            <option value="narrative">Narrative Outline</option>
          </select>
        </div>
        <div class="control-group brief-sections-group">
          <label>Include Sections:</label>
          <div id="brief-section-toggles">
            <label><input type="checkbox" data-section="targetAudience" checked> Target Audience</label>
            <label><input type="checkbox" data-section="technical" checked> Technical Requirements</label>
            <label><input type="checkbox" data-section="fileStructure"> File Structure Suggestion</label>
            <!-- Add more optional sections as needed -->
          </div>
        </div>
        <div class="control-group brief-tech-group">
          <label>Technical Context:</label>
          <select id="brief-tech-context-select">
            <option value="agnostic" selected>Technology Agnostic</option>
            <option value="web">Web (JS/HTML/CSS)</option>
            <option value="console">Console</option>
            <option value="mobile">Mobile</option>
            <option value="desktop">Desktop (General)</option>
          </select>
        </div>
      </div>
      <div id="brief-container" class="editable-container"></div>
      <div class="brief-controls">
        <button id="generate-brief-btn" class="primary-btn">Generate Brief</button>
        <button id="copy-brief-btn">Copy</button>
        <button id="download-brief-btn">Download .md</button>
      </div>
    </section>
  </main>

  <footer>
    <p>Game-Idea & Mechanic Generator • <span id="year"></span></p>
  </footer>

</body>
</html>
